<style>
:root{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:#172b3a;background:#f3f7f9;--teal:#00889a;--line:#d8e3e8;--blue:#0b79dc}
*{box-sizing:border-box}body{margin:0;background:#f3f7f9}button,select{font:inherit}button{cursor:pointer}
.topbar{min-height:76px;background:linear-gradient(90deg,#007487,#00889a);color:#fff;display:flex;align-items:center;padding:0 28px;gap:24px}.brand{font-size:30px;font-weight:750}.title{font-size:22px;font-weight:650}.top-actions{margin-left:auto;display:flex;gap:9px;align-items:center}.top-actions button{border:1px solid #ffffff88;background:#ffffff15;color:#fff;padding:9px 13px;border-radius:8px}.status{padding:7px 11px;border-radius:999px;background:#ffffff22;font-size:13px}.status.on{background:#dff6e3;color:#176b2c}
.content{display:grid;grid-template-columns:270px 1fr;gap:16px;padding:18px;max-width:1500px;margin:auto}.sidebar{display:flex;flex-direction:column;gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px #1b38490d}.side{padding:17px}.side h2{font-size:17px;margin:0 0 14px}.current{text-align:center}.value{font-size:57px;font-weight:750;font-variant-numeric:tabular-nums}.unit{font-size:24px;font-weight:600}.stability{display:inline-block;margin-top:12px;padding:6px 22px;border-radius:999px;background:#edf1f3;font-weight:650}.stable{background:#dff5df;color:#177329}.unstable{background:#fff0d8;color:#9b5a00}
.field{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:10px;margin:11px 0}.field label{font-size:14px;font-weight:600}select{width:100%;padding:9px;border:1px solid #cbd8df;border-radius:8px;background:#fff}.controls{display:grid;gap:9px;margin-top:15px}.btn{border:0;border-radius:8px;padding:11px;font-weight:650;background:#e8eef2;color:#213746}.btn.primary{background:var(--blue);color:#fff}.btn.stop{background:#6f8291;color:#fff}.btn.outline{background:#fff;border:1px solid #cbd8df}.btn:disabled{opacity:.45}.msg{font-size:12px;color:#526171;min-height:17px}
.main{min-width:0}.tabs{display:flex;padding:0 16px;border-bottom:1px solid var(--line)}.tab{padding:15px 28px;font-weight:650;color:#536574;border-bottom:3px solid transparent;cursor:pointer}.tab.active{color:var(--blue);border-color:var(--blue)}.tab-panel{display:none}.tab-panel.active{display:block}.chart-wrap{padding:18px 20px}.chart-head{display:flex;align-items:center;justify-content:space-between}.chart-head h2{font-size:17px}.stats{display:flex;gap:16px;font-size:13px;color:#526171}.stats b{color:#223746}canvas{display:block;width:100%;height:285px;background:#fff}.data-title{padding:13px 18px;background:#f4f7f9;font-weight:700;border-top:1px solid var(--line)}.table-wrap{max-height:330px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{position:sticky;top:0;background:#eef3f6}th,td{padding:9px 12px;border-bottom:1px solid #e5ebef;text-align:right}th:first-child,td:first-child{text-align:left}
.fsbtn{border:1px solid #cbd8df;background:#fff;border-radius:8px;padding:7px 10px;font-weight:650}.wide{width:100%;margin-top:14px}.overlay{position:fixed;inset:0;z-index:9999;background:#f3f7f9;display:none;flex-direction:column}.overlay.show{display:flex}.ovbar{height:68px;background:linear-gradient(90deg,#007487,#00889a);color:#fff;display:flex;align-items:center;padding:0 24px;font-size:20px;font-weight:700}.back{margin-left:auto;border:1px solid #ffffff88;background:#ffffff15;color:#fff;border-radius:8px;padding:9px 16px}.ovcontent{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:28px}.big{text-align:center}.big .n{font-size:min(20vw,210px);font-weight:780}.big .u{font-size:min(7vw,72px);font-weight:650}.big .stability{font-size:28px;padding:10px 38px}.fschartbox{width:100%;height:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column}#fsChart{height:100%;min-height:0}
.camera-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.7fr);gap:18px;padding:18px}.preview{background:#111;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}#video{width:100%;height:100%;object-fit:contain}.camside{display:flex;flex-direction:column;gap:12px;overflow:auto}.camcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.camcard h3{margin:0 0 10px}.camactions{display:grid;gap:8px}.camactions button{padding:10px;border:1px solid #cbd8df;background:#fff;border-radius:8px;font-weight:650}.camactions .capture{background:var(--blue);color:#fff;border:0}.camactions button:disabled{opacity:.45}#latestPhoto{width:100%;aspect-ratio:4/3;object-fit:contain;background:#eef2f4;border-radius:8px;display:none}.photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.photo{border:1px solid var(--line);border-radius:8px;overflow:hidden}.photo img{width:100%;aspect-ratio:4/3;object-fit:cover}.photoinfo{padding:7px;font-size:12px}

.inline-camera{margin-top:16px;padding-top:14px;border-top:1px solid #d8e3e8}
.inline-camera-head{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.inline-camera-head select{padding:7px;font-size:12px}.cam-status{font-size:11px;padding:5px 7px;border-radius:999px;background:#edf1f3}.cam-status.on{background:#dff5df;color:#177329}
.inline-preview{height:175px;background:#111;border-radius:9px;overflow:hidden;display:flex;align-items:center;justify-content:center}.inline-preview video{width:100%;height:100%;object-fit:contain}
.inline-cam-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.inline-cam-actions .primary{grid-column:1/-1;padding:9px}
.inline-photos{display:flex;gap:6px;overflow-x:auto;margin-top:8px}.inline-photo{min-width:72px;width:72px}.inline-photo img{width:72px;height:54px;object-fit:cover;border-radius:6px}.inline-photo div{font-size:10px;line-height:1.3}
.graph-settings{border-top:1px solid #d8e3e8;padding:14px 20px 16px;background:#fbfcfd}.graph-settings h2{font-size:16px;margin:0 0 10px}.settings-row{display:grid;grid-template-columns:1.2fr 1.2fr 1fr 1fr 1fr 1fr;gap:8px;align-items:end}.setting-field label{display:block;font-size:12px;font-weight:650;margin-bottom:4px}.setting-field select{padding:8px}.graph-settings .btn{padding:9px 7px;font-size:13px}

.chart-wrap{position:relative}
.chart-tooltip{position:absolute;z-index:30;display:none;min-width:190px;max-width:270px;background:#fff;border:1px solid #cbd8df;border-radius:9px;box-shadow:0 5px 18px #0002;padding:10px 12px;font-size:12px;line-height:1.55;pointer-events:none}
.chart-tooltip b{font-size:15px}.chart-tooltip img{display:block;width:100%;max-height:150px;object-fit:contain;background:#eef2f4;border-radius:6px;margin-top:7px}
.chart-legend{display:flex;gap:14px;align-items:center;font-size:12px;color:#526171;margin:5px 0 0}.legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.lg-auto{background:#1479df}.lg-manual{background:#21a45b}.lg-photo{background:#e64a4a}
.fs-point-tip{position:fixed;z-index:10050;display:none;background:#fff;border:1px solid #cbd8df;border-radius:9px;box-shadow:0 5px 18px #0003;padding:10px 12px;font-size:13px;line-height:1.55;max-width:300px}.fs-point-tip img{display:block;width:100%;max-height:170px;object-fit:contain;margin-top:7px;border-radius:6px}
.chart-actions{display:flex;gap:8px;align-items:center}
.chart-tooltip{pointer-events:auto;cursor:move;user-select:none}
.chart-tooltip.dragging{opacity:.94}
@media(max-width:850px){.content{grid-template-columns:1fr}.topbar{flex-wrap:wrap;padding:14px 18px}.top-actions{width:100%;margin-left:0}.camera-body{grid-template-columns:1fr}.stats{flex-wrap:wrap}}
.record-memo{width:170px;min-height:42px;resize:vertical;border:1px solid #cbd8df;border-radius:5px;padding:5px;font:inherit}.tip-memo-label{margin-top:8px;font-weight:bold}.chart-tooltip .record-memo,.fs-point-tip .record-memo{width:100%;box-sizing:border-box}.photo-save-modal{display:none;position:fixed;inset:0;z-index:10000;background:#0008;align-items:center;justify-content:center;padding:16px}.photo-save-modal.show{display:flex}.photo-save-box{background:white;border-radius:12px;padding:20px;max-width:850px;width:100%;max-height:85vh;overflow:auto;color:#172b3a}.photo-save-head,.photo-save-actions{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.photo-save-head h3{margin:0}.photo-save-actions{justify-content:flex-start;margin:15px 0}.photo-save-box button{padding:8px 12px;border-radius:7px;border:1px solid #bdcbd5;background:#f7fafc;cursor:pointer}.photo-save-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #ddd}.photo-save-row img{width:110px;height:78px;object-fit:contain;background:#eee}.photo-save-row>div{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}.photo-save-row button{flex-shrink:0}
</style></head>
<body>
<header class="topbar"><div class="brand">Kenis</div><div class="title">電子てんびん Webアプリ</div><div class="top-actions"><span id="conn" class="status">未接続</span><button id="connect">天びんに接続</button><button id="disconnect" disabled>切断</button><button id="csv">CSV保存</button></div></header>
<div class="content">
<aside class="sidebar">
<section class="panel side"><h2>現在の質量</h2><div class="current"><span id="weight" class="value">--.--</span><span id="unit" class="unit">g</span><br><span id="stability" class="stability">未測定</span></div><button id="valueFS" class="fsbtn wide">⛶ 測定値を全画面</button>
<div class="inline-camera">
  <div class="inline-camera-head">
    <b>カメラ</b>
    <select id="inlineCameraSelect"><option value="">カメラを選択</option></select>
    <span id="camStatus" class="cam-status">未接続</span>
  </div>
  <div class="inline-preview"><video id="inlineVideo" autoplay playsinline muted></video></div>
  <div class="inline-cam-actions">
    <button id="inlineCamStart" class="fsbtn">カメラ開始</button>
    <button id="inlineCamStop" class="fsbtn" disabled>切断</button>
    <button id="inlineCapture" class="btn primary" disabled>📷 写真＋現在値を記録</button>
  </div>
  <div id="inlinePhotos" class="inline-photos"></div>
</div>
</section>

</aside>
<main class="main panel">
<nav class="tabs"><div class="tab active" data-tab="graph">グラフ</div><div class="tab" data-tab="data">測定データ</div></nav>
<div id="graph" class="tab-panel active"><div class="chart-wrap"><div class="chart-head"><h2>質量 [g]</h2><div class="chart-actions">
<button id="saveGraphImage" class="fsbtn">グラフ画像保存</button>
<button id="chartFS" class="fsbtn">⛶ グラフを全画面</button>
</div></div><div class="stats"><span>測定回数 <b id="count">0</b></span><span>経過時間 <b id="elapsed">0.0 s</b></span><span>状態 <b id="state">待機</b></span></div><div class="chart-legend"><span><i class="legend-dot lg-auto"></i>自動記録</span><span><i class="legend-dot lg-manual"></i>手動記録</span><span><i class="legend-dot lg-photo"></i>写真</span></div>
<canvas id="chart" width="1100" height="330"></canvas><div id="chartTooltip" class="chart-tooltip"></div></div>
<div class="graph-settings">
  <h2>測定設定</h2>
  <div class="settings-row">
    <div class="setting-field"><label>測定間隔</label><select id="interval"><option value="200">0.2秒</option><option value="500">0.5秒</option><option value="1000" selected>1秒</option><option value="2000">2秒</option><option value="5000">5秒</option><option value="10000">10秒</option></select></div>
    <div class="setting-field"><label>測定時間</label><select id="duration"><option value="0">制限なし</option><option value="10">10秒</option><option value="30">30秒</option><option value="60" selected>1分</option><option value="300">5分</option><option value="600">10分</option><option value="1800">30分</option><option value="3600">60分</option></select></div>
    <button id="start" class="btn primary" disabled>▶ 記録開始</button>
    <button id="stop" class="btn stop" disabled>■ 記録停止</button>
    <button id="single" class="btn outline" disabled>● 現在の値を記録</button>
    <button id="clear" class="btn outline">データを消去</button>
  </div>
  <p id="message" class="msg"></p>
</div>
</div>
<div id="data" class="tab-panel"><div class="data-title">測定データ一覧</div><div class="table-wrap"><table><thead><tr><th>時刻</th><th>経過時間 [s]</th><th>質量 [g]</th><th>安定</th><th>記録方法</th><th>メモ</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
</main></div>

<div id="valueOverlay" class="overlay"><div class="ovbar">現在の質量<button class="back close">戻る（Esc）</button></div><div class="ovcontent"><div class="big"><span id="fsWeight" class="n">--.--</span><span id="fsUnit" class="u">g</span><br><span id="fsStability" class="stability">未測定</span></div></div></div>
<div id="chartOverlay" class="overlay"><div class="ovbar">リアルタイムグラフ<button class="back close">戻る（Esc）</button></div><div class="ovcontent"><div class="fschartbox"><canvas id="fsChart" width="1400" height="700"></canvas></div></div></div>
<div id="photoSaveModal" class="photo-save-modal" role="dialog" aria-modal="true"><div class="photo-save-box"><div class="photo-save-head"><h3>写真・測定データの保存</h3><button id="photoSaveClose">閉じる</button></div><p>保存する写真を選択してください。画像には測定値・時刻・経過時間・メモを記載します。</p><div class="photo-save-actions"><button id="photoSelectAll">すべて選択</button><button id="photoSelectNone">選択解除</button><button id="photoSaveSelected">選択した写真を保存</button></div><div id="photoSaveList"></div></div></div><div id="cameraOverlay" class="overlay"><div class="ovbar">カメラ・写真<button class="back close">戻る（Esc）</button></div><div class="camera-body"><div class="preview"><video id="video" autoplay playsinline muted></video></div><div class="camside"><div class="camcard"><h3>カメラ設定</h3><select id="cameraSelect"><option value="">カメラを選択</option></select><div class="camactions"><button id="camStart">カメラ開始</button><button id="camStop" disabled>カメラ停止</button><button id="capture" class="capture" disabled>📷 写真＋現在値を記録</button><button id="photoSaveOpen">写真保存</button></div></div><div class="camcard"><h3>最新の記録</h3><img id="latestPhoto"><div id="latestMeta" class="msg">まだ写真はありません。</div></div><div class="camcard"><h3>写真付き記録</h3><div id="photoGrid" class="photogrid"></div></div></div></div></div>

<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let port=null,reader=null,writer=null,readLoopActive=false,buffer="";
let liveTimer=null,recordTimer=null,durationTimer=null,recording=false,startTime=null;
let records=[],pending=[],latest=null,cameraStream=null,photos=[];

function msg(t){$("message").textContent=t}
function buttons(){const on=!!port;$("connect").disabled=on;$("disconnect").disabled=!on;$("start").disabled=!on||recording;$("stop").disabled=!recording;$("single").disabled=!on}
async function connect(){
 if(!("serial" in navigator)){alert("Web Serialを利用できません。Windows/ChromebookのChromeまたはEdgeで開いてください。");return}
 try{
  port=await navigator.serial.requestPort();
  await port.open({baudRate:2400,dataBits:7,stopBits:2,parity:"none",flowControl:"none"});
  writer=port.writable.getWriter();reader=port.readable.getReader();readLoopActive=true;readLoop();
  $("conn").textContent="接続済み";$("conn").className="status on";buttons();msg("天びんに接続しました。");
  startLive();
 }catch(e){msg("接続できませんでした: "+e.message);port=null;buttons()}
}
async function disconnect(){
 stopRecording();stopLive();readLoopActive=false;
 try{if(reader){await reader.cancel();reader.releaseLock();reader=null}}catch(e){}
 try{if(writer){writer.releaseLock();writer=null}}catch(e){}
 try{if(port){await port.close()}}catch(e){}
 port=null;$("conn").textContent="未接続";$("conn").className="status";buttons();msg("切断しました。");
}
async function readLoop(){
 try{
  while(readLoopActive&&reader){
   const {value,done}=await reader.read();if(done)break;
   buffer+=new TextDecoder().decode(value);
   let i;
   while((i=buffer.indexOf("\r"))>=0){const line=buffer.slice(0,i).trim();buffer=buffer.slice(i+1);if(line)handleLine(line)}
  }
 }catch(e){if(readLoopActive)msg("受信エラー: "+e.message)}
}
function handleLine(line){
 const m=line.match(/([-+]?\d+(?:\.\d+)?)\s*([a-zA-Z]+)?\s*(\?)?/);if(!m)return;
 const value=Number(m[1]),unit=m[2]||"g",stable=!line.includes("?");
 latest={value,unit,stable,time:new Date()};showCurrent();
 const req=pending.shift();if(req?.record)addRecord(value,unit,stable,req.kind,req.requestedElapsed,req.requestedTime);
}
function showCurrent(){
 if(!latest)return;
 $("weight").textContent=$("fsWeight").textContent=latest.value.toFixed(2);
 $("unit").textContent=$("fsUnit").textContent=latest.unit;
 const t=latest.stable?"安定":"変動中",c="stability "+(latest.stable?"stable":"unstable");
 $("stability").textContent=$("fsStability").textContent=t;$("stability").className=$("fsStability").className=c;
}
async function request(kind="ライブ",record=false){
 if(!writer||pending.length)return;
 try{
  const requestedTime=new Date();
  let requestedElapsed=startTime?(performance.now()-startTime)/1000:0;
  if(kind==="自動"&&startTime){
    const step=Number($("interval").value)/1000;
    requestedElapsed=Math.round(requestedElapsed/step)*step;
  }
  pending.push({kind,record,requestedTime,requestedElapsed});
  await writer.write(new TextEncoder().encode("IP\r"));
  setTimeout(()=>{if(pending.length)pending.shift()},900);
 }catch(e){pending=[];msg("送信エラー: "+e.message)}
}
function startLive(){stopLive();liveTimer=setInterval(()=>{if(!recording)request("ライブ",false)},500);request("ライブ",false)}
function stopLive(){if(liveTimer)clearInterval(liveTimer);liveTimer=null}
function startRecording(){
 if(!port||recording)return;recording=true;if(!startTime)startTime=performance.now();buttons();$("state").textContent="記録中";
 const ms=Number($("interval").value);recordTimer=setInterval(()=>request("自動",true),ms);request("自動",true);
 const sec=Number($("duration").value);if(sec>0)durationTimer=setTimeout(stopRecording,sec*1000);
}
function stopRecording(){recording=false;if(recordTimer)clearInterval(recordTimer);if(durationTimer)clearTimeout(durationTimer);recordTimer=durationTimer=null;buttons();$("state").textContent="待機"}
function addRecord(value,unit,stable,kind,elapsedOverride=null,timeOverride=null){
 if(!startTime)startTime=performance.now();
 const elapsed=elapsedOverride!=null?elapsedOverride:(performance.now()-startTime)/1000;
 const rec={id:Date.now()+Math.random(),time:timeOverride||new Date(),elapsed,value,unit,stable,kind,photo:null,memo:""};
 records.push(rec);render();return rec;
}
function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function render(){
 $("count").textContent=records.length;$("elapsed").textContent=(records.at(-1)?.elapsed||0).toFixed(1)+" s";
 $("tbody").innerHTML=records.slice().reverse().map(r=>`<tr><td>${r.time.toLocaleTimeString("ja-JP",{hour12:false})}</td><td>${r.elapsed.toFixed(1)}</td><td>${r.value.toFixed(2)}</td><td>${r.stable?"○":"—"}</td><td>${r.kind}</td><td><textarea class="record-memo" data-record-id="${r.id}" placeholder="メモを入力">${escapeHTML(r.memo||"")}</textarea></td></tr>`).join("");
 drawChart($("chart"));if($("chartOverlay").classList.contains("show"))drawChart($("fsChart"));
}
function drawChart(c){
 const ctx=c.getContext("2d"),w=c.width,h=c.height,p=58;
 ctx.clearRect(0,0,w,h);ctx.strokeStyle="#d9e2e8";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p,15);ctx.lineTo(p,h-p);ctx.lineTo(w-15,h-p);ctx.stroke();
 c._points=[];
 if(!records.length)return;
 const d=records.slice(-500),xs=d.map(x=>x.elapsed),ys=d.map(x=>x.value);
 let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
 if(xmax===xmin)xmax=xmin+1;if(ymax===ymin){ymin-=1;ymax+=1}const q=(ymax-ymin)*.08;ymin-=q;ymax+=q;
 ctx.fillStyle="#526171";ctx.font="14px sans-serif";ctx.fillText(ymax.toFixed(2)+" g",4,25);ctx.fillText(ymin.toFixed(2)+" g",4,h-p);ctx.fillText(xmin.toFixed(1)+" s",p,h-20);ctx.fillText(xmax.toFixed(1)+" s",w-75,h-20);
 const pts=d.map(r=>({r,x:p+(r.elapsed-xmin)/(xmax-xmin)*(w-p-20),y:15+(ymax-r.value)/(ymax-ymin)*(h-p-15)}));
 ctx.strokeStyle="#7aa9d8";ctx.lineWidth=2;ctx.beginPath();pts.forEach((pt,i)=>i?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y));ctx.stroke();
 pts.forEach(pt=>{
   const color=pt.r.kind==="写真"?"#e64a4a":pt.r.kind==="手動"?"#21a45b":"#1479df";
   ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r.kind==="写真"?6:5,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.stroke();
 });
 c._points=pts;
}
function pointFromEvent(c,e){
 const rect=c.getBoundingClientRect(),sx=c.width/rect.width,sy=c.height/rect.height;
 const x=(e.clientX-rect.left)*sx,y=(e.clientY-rect.top)*sy;
 let best=null,dist=Infinity;(c._points||[]).forEach(pt=>{const d=Math.hypot(pt.x-x,pt.y-y);if(d<dist){dist=d;best=pt}});
 return dist<=14?best:null;
}
function showPointTooltip(e,pt){
 const tip=$("chartTooltip"),r=pt.r;
 const method=r.kind==="自動"?"自動記録":r.kind==="手動"?"手動記録":"写真";
 tip.innerHTML=`<b>${r.value.toFixed(2)} ${r.unit}</b><br>経過時間：${r.elapsed.toFixed(2)} s<br>時刻：${r.time.toLocaleTimeString("ja-JP",{hour12:false})}<br>記録：${method}${r.photo?`<img src="${r.photo}" alt="撮影画像">`:""}<div class="tip-memo-label">メモ</div><textarea class="record-memo" data-record-id="${r.id}" placeholder="メモを入力">${escapeHTML(r.memo||"")}</textarea>`;
 tip.style.display="block";
 const wrap=tip.parentElement,wr=wrap.getBoundingClientRect();
 let left=e.clientX-wr.left+12,top=e.clientY-wr.top+12;
 if(left+270>wr.width)left=Math.max(5,left-285);
 if(top+220>wr.height)top=Math.max(5,top-225);
 tip.style.left=left+"px";tip.style.top=top+"px";
}

let tipDrag=null;
$("chartTooltip").addEventListener("pointerdown",e=>{
 const tip=$("chartTooltip"),wrap=tip.parentElement;
 if(e.target.closest("textarea"))return;tip.setPointerCapture(e.pointerId);
 const tr=tip.getBoundingClientRect();
 tipDrag={id:e.pointerId,dx:e.clientX-tr.left,dy:e.clientY-tr.top,wrap};
 tip.classList.add("dragging");e.preventDefault();e.stopPropagation();
});
$("chartTooltip").addEventListener("pointermove",e=>{
 if(!tipDrag||e.pointerId!==tipDrag.id)return;
 const tip=$("chartTooltip"),wr=tipDrag.wrap.getBoundingClientRect();
 let left=e.clientX-wr.left-tipDrag.dx,top=e.clientY-wr.top-tipDrag.dy;
 left=Math.max(4,Math.min(left,wr.width-tip.offsetWidth-4));
 top=Math.max(4,Math.min(top,wr.height-tip.offsetHeight-4));
 tip.style.left=left+"px";tip.style.top=top+"px";
});
$("chartTooltip").addEventListener("pointerup",e=>{
 if(tipDrag&&e.pointerId===tipDrag.id){$("chartTooltip").classList.remove("dragging");tipDrag=null}
});
function saveGraphImage(){
 const src=$("chart"),scale=2,w=src.width,h=src.height,top=105;
 const c=document.createElement("canvas");c.width=w*scale;c.height=(h+top)*scale;
 const ctx=c.getContext("2d");ctx.scale(scale,scale);ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h+top);
 ctx.fillStyle="#172b3a";ctx.font="bold 24px sans-serif";ctx.fillText("質量 [g]",20,34);
 ctx.font="14px sans-serif";ctx.fillStyle="#526171";
 ctx.fillText(`測定回数 ${records.length}　 経過時間 ${(records.at(-1)?.elapsed||0).toFixed(1)} s`,20,60);
 const dots=[["#1479df","自動記録"],["#21a45b","手動記録"],["#e64a4a","写真"]];
 let x=20;
 dots.forEach(([color,label])=>{
  ctx.beginPath();ctx.arc(x+5,84,5,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
  ctx.fillStyle="#526171";ctx.fillText(label,x+16,89);x+=90;
 });
 ctx.drawImage(src,0,top,w,h);
 c.toBlob(blob=>{
  const a=document.createElement("a"),d=new Date(),pad=n=>String(n).padStart(2,"0");
  a.href=URL.createObjectURL(blob);
  a.download=`KN_graph_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.png`;
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 },"image/png");
}
$("saveGraphImage").onclick=saveGraphImage;

$("chart").addEventListener("click",e=>{const pt=pointFromEvent($("chart"),e);if(pt)showPointTooltip(e,pt);else $("chartTooltip").style.display="none"});
$("chart").addEventListener("mousemove",e=>{$("chart").style.cursor=pointFromEvent($("chart"),e)?"pointer":"default"});
document.addEventListener("click",e=>{if(!e.target.closest(".chart-wrap"))$("chartTooltip").style.display="none"});

function clearData(){records=[];photos=[];startTime=null;render();renderPhotos();msg("データを消去しました。")}
function csv(){
 if(!records.length){msg("保存するデータがありません。");return}
 const rows=[["時刻","経過時間[s]","質量[g]","安定","記録方法","メモ"],...records.map(r=>[r.time.toLocaleTimeString("ja-JP",{hour12:false}),r.elapsed.toFixed(2),r.value.toFixed(2),r.stable?"安定":"変動中",r.kind,r.memo||""])];
 const blob=new Blob(["\ufeff"+rows.map(r=>r.map(v=>"\""+String(v).replace(/"/g,"\"\"")+"\"").join(",")).join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="balance_data.csv";a.click();URL.revokeObjectURL(a.href);
}
function openOverlay(id){$(id).classList.add("show");document.body.style.overflow="hidden";if(id==="chartOverlay")drawChart($("fsChart"));if(id==="cameraOverlay")listCameras()}
function closeOverlay(){document.querySelectorAll(".overlay.show").forEach(x=>x.classList.remove("show"));document.body.style.overflow="";if($("fsPointTip"))$("fsPointTip").style.display="none"}
async function listCameras(){
 if(!navigator.mediaDevices?.enumerateDevices){msg("カメラ機能を利用できません。");return}
 const ds=await navigator.mediaDevices.enumerateDevices(),cams=ds.filter(d=>d.kind==="videoinput"),s=$("cameraSelect"),old=s.value;s.innerHTML='<option value="">カメラを選択</option>';
 cams.forEach((d,i)=>{const o=document.createElement("option");o.value=d.deviceId;o.textContent=d.label||`カメラ ${i+1}`;s.appendChild(o)});if([...s.options].some(o=>o.value===old))s.value=old;
 const ins=$("inlineCameraSelect");if(ins){const prev=ins.value;ins.innerHTML=s.innerHTML;if([...ins.options].some(o=>o.value===prev))ins.value=prev;}
}
async function startCamera(){
 try{stopCamera();const id=($("inlineCameraSelect")?.value||$("cameraSelect").value);cameraStream=await navigator.mediaDevices.getUserMedia({video:id?{deviceId:{exact:id}}:true,audio:false});$("video").srcObject=cameraStream;if($("inlineVideo"))$("inlineVideo").srcObject=cameraStream;$("camStart").disabled=true;$("camStop").disabled=false;$("capture").disabled=false;if($("inlineCamStart"))$("inlineCamStart").disabled=true;if($("inlineCamStop"))$("inlineCamStop").disabled=false;if($("inlineCapture"))$("inlineCapture").disabled=false;if($("camStatus")){$("camStatus").textContent="接続中";$("camStatus").className="cam-status on";}await listCameras();const d=cameraStream.getVideoTracks()[0].getSettings().deviceId;if(d)$("cameraSelect").value=d}catch(e){msg("カメラを開始できませんでした: "+e.message)}
}
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}$("video").srcObject=null;if($("inlineVideo"))$("inlineVideo").srcObject=null;$("camStart").disabled=false;$("camStop").disabled=true;$("capture").disabled=true;if($("inlineCamStart"))$("inlineCamStart").disabled=false;if($("inlineCamStop"))$("inlineCamStop").disabled=true;if($("inlineCapture"))$("inlineCapture").disabled=true;if($("camStatus")){$("camStatus").textContent="未接続";$("camStatus").className="cam-status";}}
async function capture(){
 if(!cameraStream||!latest){msg("カメラと天びんの測定値を確認してください。");return}
 await request("写真確認",false);await sleep(220);const v=$("inlineVideo")?.videoWidth?$("inlineVideo"):$("video");if(!v.videoWidth)return;
 const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);const elapsed=startTime?(performance.now()-startTime)/1000:0;
 const p={image:c.toDataURL("image/jpeg",.88),value:latest.value,unit:latest.unit,stable:latest.stable,time:new Date(),elapsed};photos.push(p);const rec=addRecord(p.value,p.unit,p.stable,"写真",p.elapsed,p.time);rec.photo=p.image;render();renderPhotos();
}
function renderPhotos(){
 const p=photos.at(-1);if(p){$("latestPhoto").src=p.image;$("latestPhoto").style.display="block";$("latestMeta").innerHTML=`${p.time.toLocaleTimeString("ja-JP",{hour12:false})}<br><b>${p.value.toFixed(2)} ${p.unit}</b> ／ ${p.stable?"安定":"変動中"}`}else{$("latestPhoto").style.display="none";$("latestMeta").textContent="まだ写真はありません。"}
 $("photoGrid").innerHTML=photos.slice().reverse().map(x=>`<div class="photo"><img src="${x.image}"><div class="photoinfo"><b>${x.value.toFixed(2)} ${x.unit}</b><br>${x.time.toLocaleTimeString("ja-JP",{hour12:false})}</div></div>`).join("");if($("inlinePhotos"))$("inlinePhotos").innerHTML=photos.slice(-4).reverse().map(x=>`<div class="inline-photo"><img src="${x.image}"><div>${x.value.toFixed(2)} ${x.unit}<br>${x.time.toLocaleTimeString("ja-JP",{hour12:false})}</div></div>`).join("");
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tab-panel").forEach(x=>x.classList.remove("active"));t.classList.add("active");$(t.dataset.tab).classList.add("active")});
$("connect").onclick=connect;$("disconnect").onclick=disconnect;$("start").onclick=startRecording;$("stop").onclick=stopRecording;$("single").onclick=()=>request("手動",true);$("clear").onclick=clearData;$("csv").onclick=csv;
$("valueFS").onclick=()=>openOverlay("valueOverlay");$("chartFS").onclick=()=>openOverlay("chartOverlay");document.querySelectorAll(".close").forEach(b=>b.onclick=closeOverlay);document.addEventListener("keydown",e=>{if(e.key==="Escape")closeOverlay()});
if($("inlineCamStart"))$("inlineCamStart").onclick=startCamera;
if($("inlineCamStop"))$("inlineCamStop").onclick=stopCamera;
if($("inlineCapture"))$("inlineCapture").onclick=capture;
if($("inlineCameraSelect"))$("inlineCameraSelect").onchange=()=>{if(cameraStream)startCamera()};
listCameras();
$("camStart").onclick=startCamera;$("camStop").onclick=stopCamera;$("capture").onclick=capture;$("cameraSelect").onchange=()=>{if(cameraStream)startCamera()};

$("fsChart").addEventListener("click",e=>{
 const pt=pointFromEvent($("fsChart"),e),tip=$("fsPointTip");if(!pt){tip.style.display="none";return}
 const r=pt.r;tip.innerHTML=`<b>${r.value.toFixed(2)} ${r.unit}</b><br>経過時間：${r.elapsed.toFixed(2)} s<br>時刻：${r.time.toLocaleTimeString("ja-JP",{hour12:false})}<br>記録：${r.kind}${r.photo?`<img src="${r.photo}" alt="撮影画像">`:""}<div class="tip-memo-label">メモ</div><textarea class="record-memo" data-record-id="${r.id}" placeholder="メモを入力">${escapeHTML(r.memo||"")}</textarea>`;
 tip.style.left=Math.min(e.clientX+12,window.innerWidth-315)+"px";tip.style.top=Math.min(e.clientY+12,window.innerHeight-230)+"px";tip.style.display="block";
});
$("fsChart").addEventListener("mousemove",e=>{$("fsChart").style.cursor=pointFromEvent($("fsChart"),e)?"pointer":"default"});

document.addEventListener("input",e=>{if(!e.target.matches(".record-memo"))return;const r=records.find(x=>String(x.id)===e.target.dataset.recordId);if(r){r.memo=e.target.value;document.querySelectorAll(`.record-memo[data-record-id="${r.id}"]`).forEach(el=>{if(el!==e.target)el.value=r.memo})}});
function downloadPhoto(r){
 const im=new Image();im.onload=()=>{const w=im.naturalWidth,h=im.naturalHeight,scale=Math.max(1,w/900),pad=20*scale,lh=27*scale;
 const lines=[`測定値: ${r.value.toFixed(2)} ${r.unit} / ${r.stable?"安定":"変動中"}`,`時刻: ${r.time.toLocaleString("ja-JP")}`,`経過時間: ${r.elapsed.toFixed(2)} s`,...((r.memo||"").split("\n").map((x,i)=>(i===0?"メモ: ":"      ")+x))];
 const c=document.createElement("canvas");c.width=w;c.height=h+pad*2+lines.length*lh;const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,w,h);ctx.fillStyle="#172b3a";ctx.font=`${18*scale}px sans-serif`;lines.forEach((line,i)=>ctx.fillText(line,pad,h+pad+(i+0.8)*lh,w-pad*2));
 c.toBlob(blob=>{if(!blob)return;const a=document.createElement("a");a.href=URL.createObjectURL(blob);const d=r.time,fmt=n=>String(n).padStart(2,"0");a.download=`KN_photo_${d.getFullYear()}${fmt(d.getMonth()+1)}${fmt(d.getDate())}_${fmt(d.getHours())}${fmt(d.getMinutes())}${fmt(d.getSeconds())}_${Math.round(r.elapsed*100)}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)},"image/png")};im.src=r.photo;
}
function renderPhotoSaveList(){const list=$('photoSaveList'),rs=records.filter(r=>r.photo).reverse();list.innerHTML=rs.length?rs.map(r=>`<div class="photo-save-row"><input type="checkbox" class="photo-choice" value="${r.id}"><img src="${r.photo}" alt="記録写真"><div><b>${r.value.toFixed(2)} ${r.unit}</b><div>${r.time.toLocaleString("ja-JP")} / ${r.elapsed.toFixed(2)} s</div><div>${escapeHTML(r.memo||"")}</div></div><button class="photo-one" data-id="${r.id}">この写真を保存</button></div>`).join(""):"保存できる写真がありません。"}
$('photoSaveOpen').onclick=()=>{$('photoSaveModal').classList.add('show');renderPhotoSaveList()};$('photoSaveClose').onclick=()=>$('photoSaveModal').classList.remove('show');$('photoSaveModal').addEventListener('click',e=>{if(e.target.id==='photoSaveModal')e.currentTarget.classList.remove('show');if(e.target.matches('.photo-one')){const r=records.find(x=>String(x.id)===e.target.dataset.id);if(r)downloadPhoto(r)}});
$('photoSelectAll').onclick=()=>document.querySelectorAll('.photo-choice').forEach(x=>x.checked=true);$('photoSelectNone').onclick=()=>document.querySelectorAll('.photo-choice').forEach(x=>x.checked=false);
$('photoSaveSelected').onclick=()=>{const ids=[...document.querySelectorAll('.photo-choice:checked')].map(x=>x.value);if(!ids.length){alert('写真を選択してください。');return}ids.forEach((id,i)=>{const r=records.find(x=>String(x.id)===id);if(r)setTimeout(()=>downloadPhoto(r),i*300)})};
buttons();drawChart($("chart"));
